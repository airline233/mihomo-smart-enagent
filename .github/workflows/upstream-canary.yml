name: upstream-canary

# 上游漂移探针。
#
# 没有 fork 就没有"我落后了几个提交"这种感知，取而代之的是这个：每天用上游最新
# Alpha 试一次"打补丁 + 编译"。红了就说明上游动了我们补丁依赖的锚点，立刻知道，
# 而不是等下次发版才发现。
#
# 失败时优先看两种修法：
#   1) 0001-register-enagent.patch 的 hunk 上下文对不上了 → 向上游最新代码重新导出补丁
#      （见 _integration/patches/README 里的步骤）
#   2) 上游改了 EnAgentOption 用到的接口（AdapterType / BasicOption / NewConn）
#      → 改 _integration/adapter/outbound/enagent.go

on:
  schedule:
    # 每天 20:43 UTC（北京时间次日 04:43），比 build.yml 早一点，先探路。
    - cron: '43 20 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  UPSTREAM: https://github.com/lux5am/mihomo-smart.git
  UPSTREAM_REF: Alpha

jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: src

      - uses: actions/setup-go@v5
        with:
          go-version: '1.20'
          cache: false

      - name: clone 上游最新
        working-directory: src
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$UPSTREAM_REF" "$UPSTREAM" mihomo
          echo "上游 HEAD: $(git -C mihomo log -1 --format='%H %ad %s' --date=short)"

      - name: 打补丁（漂移就红）
        working-directory: src/mihomo
        run: |
          set -euo pipefail
          if ! git apply -3 --verbose ../_integration/patches/0001-register-enagent.patch; then
            echo "::error::补丁已经无法应用到上游 $UPSTREAM_REF —— 上游挪了锚点，需要重新导出补丁"
            exit 1
          fi

      - name: 注入 enagent 模块与 adapter
        working-directory: src
        run: |
          set -euo pipefail
          mkdir -p mihomo/enagent
          cp go.mod go.sum mihomo/enagent/
          for p in passkey cas spa tunnel stack session; do cp -r "$p" mihomo/enagent/; done
          cp _integration/adapter/outbound/enagent*.go mihomo/adapter/outbound/

      - name: 编译受影响的包
        working-directory: src/mihomo
        run: |
          set -euo pipefail
          go build -tags with_gvisor ./adapter/... ./constant/... \
            || { echo "::error::上游改动让 enagent 编译不过，需要更新 adapter"; exit 1; }

      - name: EnAgent 会话与并发回归
        working-directory: src/mihomo
        run: go test -race -tags with_gvisor ./adapter/outbound -run '^TestEnAgent' -count=1 -timeout=60s

      - name: 完整二进制编译
        working-directory: src/mihomo
        env:
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          mkdir -p ../dist
          go build -tags with_gvisor -trimpath -o ../dist/mihomo-canary .

      - name: 冒烟检查
        working-directory: src
        run: |
          set -euo pipefail
          grep -qa "隧道就绪" dist/mihomo-canary || {
            echo "::error::二进制里没有 EnAgent 实现"; exit 1; }
          echo "上游 $UPSTREAM_REF 仍然可以正常打补丁并编译"
