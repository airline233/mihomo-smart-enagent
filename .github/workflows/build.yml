name: build-mihomo-enagent

# 仓库里**不存放** mihomo 源码：每次都在 runner 上现拉上游、打补丁、注入 enagent 模块、
# 编译出产物。于是"跟随上游"不是一个需要定期执行的动作 —— CI 永远用最新上游编译。
#
# 步骤与 scripts/build-mihomo.sh、scripts/build-mihomo.ps1 完全一致，
# 避免出现"CI 绿了但本地编不出来"。

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      upstream-ref:
        description: 'mihomo-smart 的 ref（分支或 tag）'
        required: false
        default: 'Alpha'
      ref-canary:
        description: '填写 head 表示跟 Alpha 最新提交（产物不可复现，仅用于排查）'
        required: false
        default: ''
  schedule:
    # 每天 03:17 UTC 检查上游是否有新 commit。
    - cron: '17 3 * * *'

permissions:
  contents: write

env:
  UPSTREAM: https://github.com/lux5am/mihomo-smart.git

jobs:
  preflight:
    name: 检查上游更新
    runs-on: ubuntu-latest
    outputs:
      should-build: ${{ steps.check.outputs.should-build }}
      upstream-ref: ${{ steps.resolve.outputs.ref }}
      upstream-sha: ${{ steps.resolve.outputs.sha }}
      upstream-short-sha: ${{ steps.resolve.outputs.short-sha }}
      release-tag: ${{ steps.check.outputs.release-tag }}
    steps:
      - name: 解析上游 ref 与 commit
        id: resolve
        run: |
          set -euo pipefail
          ref='${{ github.event.inputs.upstream-ref }}'
          if [ '${{ github.event.inputs.ref-canary }}' = 'head' ]; then ref='Alpha'; fi
          if [ -z "$ref" ]; then ref='Alpha'; fi

          sha=$(git ls-remote "$UPSTREAM" "refs/heads/$ref" "refs/tags/$ref" | head -n1 | cut -f1)
          if [ -z "$sha" ]; then
            echo "::error::上游不存在 ref: $ref"
            exit 1
          fi
          short_sha=${sha:0:12}
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short-sha=$short_sha" >> "$GITHUB_OUTPUT"
          echo "上游 $ref: $sha"

      - name: 检查本仓库是否已经构建
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          releases=$(curl -fsS \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases?per_page=100")
          if jq -e --arg sha '${{ steps.resolve.outputs.sha }}' \
              'any(.[]; ((.body // "") | contains($sha)))' <<< "$releases" >/dev/null; then
            echo "上游 commit ${{ steps.resolve.outputs.sha }} 已经在本仓库构建过，跳过构建"
            should_build=false
          else
            echo "上游 commit ${{ steps.resolve.outputs.sha }} 尚未在本仓库构建，将构建"
            should_build=true
          fi
          release_date=$(date -u +%F)
          release_tag="${release_date}-${{ steps.resolve.outputs.short-sha }}"
          echo "should-build=$should_build" >> "$GITHUB_OUTPUT"
          echo "release-tag=$release_tag" >> "$GITHUB_OUTPUT"

  build:
    if: needs.preflight.outputs.should-build == 'true'
    needs: preflight
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # 只构建真正要用的目标：照抄上游 30 个平台的矩阵只会白白烧时间。
          - { target: windows-amd64, goos: windows, goarch: amd64, goamd64: v3, ext: '.exe' }
          - { target: linux-amd64,   goos: linux,   goarch: amd64, goamd64: v3, ext: '' }
          - { target: linux-arm64,   goos: linux,   goarch: arm64, goamd64: '',  ext: '' }
          - { target: macos-arm64,   goos: darwin,  goarch: arm64, goamd64: '',  ext: '' }
    steps:
      - uses: actions/checkout@v4
        with:
          path: src

      - uses: actions/setup-go@v5
        with:
          go-version: '1.20'
          # 每次都 clone 上游，module cache 复用价值有限，关掉更省事。
          cache: false

      - name: clone 上游
        working-directory: src
        run: |
          set -euo pipefail
          git clone --depth 1 --branch '${{ needs.preflight.outputs.upstream-ref }}' "$UPSTREAM" mihomo
          actual_sha=$(git -C mihomo rev-parse HEAD)
          if [ "$actual_sha" != '${{ needs.preflight.outputs.upstream-sha }}' ]; then
            echo "::error::clone 到的上游 commit 与预检不一致"
            exit 1
          fi
          echo "UPSTREAM_SHA=$(git -C mihomo rev-parse --short HEAD)" >> "$GITHUB_ENV"
          git -C mihomo log -1 --format='上游 HEAD: %H %ad %s' --date=short

      - name: 打注册补丁
        working-directory: src/mihomo
        run: |
          # -3：三方合并，上游挪动锚点时由 git 自己合，而不是硬失败。
          git apply -3 --verbose ../_integration/patches/0001-register-enagent.patch

      - name: 注入 enagent 模块与 adapter
        working-directory: src
        run: |
          set -euo pipefail
          # 顺序很重要：先打补丁（它会改 mihomo/go.mod），再放我们的模块。
          mkdir -p mihomo/enagent
          cp go.mod go.sum mihomo/enagent/
          for p in passkey cas spa tunnel stack session; do
            cp -r "$p" mihomo/enagent/
          done
          cp _integration/adapter/outbound/enagent*.go mihomo/adapter/outbound/
          ls mihomo/enagent

      - name: 编译
        working-directory: src/mihomo
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOAMD64: ${{ matrix.goamd64 }}
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          mkdir -p ../dist
          version="enagent-${{ needs.preflight.outputs.upstream-ref }}-${{ needs.preflight.outputs.upstream-short-sha }}"
          go build -tags with_gvisor -trimpath \
            -ldflags "-s -w -X github.com/metacubex/mihomo/constant.Version=$version -X github.com/metacubex/mihomo/constant.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o "../dist/mihomo-enagent-${{ matrix.target }}${{ matrix.ext }}" .

      - name: 冒烟检查（确认链进去的是真实实现，而不是 stub）
        working-directory: src
        run: |
          set -euo pipefail
          binary="dist/mihomo-enagent-${{ matrix.target }}${{ matrix.ext }}"
          if ! grep -qa "隧道就绪" "$binary"; then
            echo "::error::$binary 里没有 EnAgent 实现，可能编译成了 stub"
            exit 1
          fi
          echo "$binary 已包含 EnAgent 实现"

      - uses: actions/upload-artifact@v4
        with:
          name: mihomo-enagent-${{ matrix.target }}
          path: src/dist/*
          if-no-files-found: error

  release:
    if: needs.preflight.outputs.should-build == 'true'
    needs: [preflight, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 上传 release 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: mihomo-enagent-release-${{ github.run_number }}
          path: dist/*
          if-no-files-found: error

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.preflight.outputs.release-tag }}
          name: mihomo-enagent ${{ needs.preflight.outputs.release-tag }}
          files: dist/*
          body: |
            基于 [lux5am/mihomo-smart](https://github.com/lux5am/mihomo-smart) + enagent outbound 构建。

            上游 ref：`${{ needs.preflight.outputs.upstream-ref }}`
            上游 commit：`${{ needs.preflight.outputs.upstream-sha }}`

            ⚠️ 仅通过"能编译 + 已链接 EnAgent 实现"的检查。真机联通性需要校园网与
            真实 passkey 凭据，只能在本地验证，请自行测试后再使用。
