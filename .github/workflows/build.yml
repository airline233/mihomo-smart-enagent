name: build-mihomo-enagent

# 仓库里**不存放** mihomo 源码：每次都在 runner 上现拉上游、打补丁、注入 enagent 模块、
# 编译出产物。于是"跟随上游"不是一个需要定期执行的动作 —— CI 永远用最新上游编译。
#
# 步骤与 scripts/build-mihomo.sh、scripts/build-mihomo.ps1 完全一致，
# 避免出现"CI 绿了但本地编不出来"。

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      upstream-ref:
        description: 'mihomo-smart 的 ref（分支或 tag）'
        required: false
        default: 'Alpha'
      ref-canary:
        description: '填写 head 表示跟 Alpha 最新提交（产物不可复现，仅用于排查）'
        required: false
        default: ''
  schedule:
    # 每天 03:17 UTC 跟随上游重建一次。
    - cron: '17 3 * * *'

permissions:
  contents: write

env:
  UPSTREAM: https://github.com/lux5am/mihomo-smart.git

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # 只构建真正要用的目标：照抄上游 30 个平台的矩阵只会白白烧时间。
          - { target: windows-amd64, goos: windows, goarch: amd64, goamd64: v3, ext: '.exe' }
          - { target: linux-amd64,   goos: linux,   goarch: amd64, goamd64: v3, ext: '' }
          - { target: linux-arm64,   goos: linux,   goarch: arm64, goamd64: '',  ext: '' }
    steps:
      - uses: actions/checkout@v4
        with:
          path: src

      - uses: actions/setup-go@v5
        with:
          go-version: '1.20'
          # 每次都 clone 上游，module cache 复用价值有限，关掉更省事。
          cache: false

      - name: 解析上游 ref
        id: upstream
        working-directory: src
        run: |
          set -euo pipefail
          ref='${{ github.event.inputs.upstream-ref }}'
          if [ '${{ github.event.inputs.ref-canary }}' = 'head' ]; then
            # 手动触发才允许跟 HEAD
            ref='Alpha'
          fi
          if [ -z "$ref" ]; then ref='Alpha'; fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "使用上游 ref: $ref"

      - name: clone 上游
        working-directory: src
        run: |
          set -euo pipefail
          git clone --depth 1 --branch '${{ steps.upstream.outputs.ref }}' "$UPSTREAM" mihomo
          echo "UPSTREAM_SHA=$(git -C mihomo rev-parse --short HEAD)" >> "$GITHUB_ENV"
          git -C mihomo log -1 --format='上游 HEAD: %H %ad %s' --date=short

      - name: 打注册补丁
        working-directory: src/mihomo
        run: |
          # -3：三方合并，上游挪动锚点时由 git 自己合，而不是硬失败。
          git apply -3 --verbose ../_integration/patches/0001-register-enagent.patch

      - name: 注入 enagent 模块与 adapter
        working-directory: src
        run: |
          set -euo pipefail
          # 顺序很重要：先打补丁（它会改 mihomo/go.mod），再放我们的模块。
          mkdir -p mihomo/enagent
          cp go.mod go.sum mihomo/enagent/
          for p in passkey cas spa tunnel stack session; do
            cp -r "$p" mihomo/enagent/
          done
          cp _integration/adapter/outbound/enagent*.go mihomo/adapter/outbound/
          ls mihomo/enagent

      - name: 编译
        working-directory: src/mihomo
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOAMD64: ${{ matrix.goamd64 }}
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          mkdir -p ../dist
          version="enagent-${{ steps.upstream.outputs.ref }}-${UPSTREAM_SHA}"
          go build -tags with_gvisor -trimpath \
            -ldflags "-s -w -X github.com/metacubex/mihomo/constant.Version=$version -X github.com/metacubex/mihomo/constant.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o "../dist/mihomo-enagent-${{ matrix.target }}${{ matrix.ext }}" .

      - name: 冒烟检查（确认链进去的是真实实现，而不是 stub）
        working-directory: src
        run: |
          set -euo pipefail
          binary="dist/mihomo-enagent-${{ matrix.target }}${{ matrix.ext }}"
          if ! grep -qa "隧道就绪" "$binary"; then
            echo "::error::$binary 里没有 EnAgent 实现，可能编译成了 stub"
            exit 1
          fi
          echo "$binary 已包含 EnAgent 实现"

      - uses: actions/upload-artifact@v4
        with:
          name: mihomo-enagent-${{ matrix.target }}
          path: src/dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body: |
            基于 [lux5am/mihomo-smart](https://github.com/lux5am/mihomo-smart) + enagent outbound 构建。

            ⚠️ 仅通过"能编译 + 已链接 EnAgent 实现"的检查。真机联通性需要校园网与
            真实 passkey 凭据，只能在本地验证，请自行测试后再使用。
